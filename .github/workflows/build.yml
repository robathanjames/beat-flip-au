name: Build and test Dustbox

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable engine tests
        run: cmake -S . -B build -DBEATFLIP_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build and test
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Address and undefined behavior checks
        run: |
          c++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ISource Source/GlitchEngine.cpp Tests/EngineTests.cpp Tests/AllocationGuard.cpp -o build/beatflip_sanitized
          build/beatflip_sanitized
  audio-unit:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build universal Audio Unit and standalone app
        id: build
        run: bash scripts/build-macos.sh
      - name: Install and validate Audio Unit
        run: |
          bash scripts/install-au.sh
          component="$HOME/Library/Audio/Plug-Ins/Components/Dustbox.component"
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents' "$component/Contents/Info.plist"
          codesign --force --sign - --timestamp=none "$component"
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -a
          auval -v aufx BtFp Rbjm
      - name: Package development build
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build-macos/BeatFlip_artefacts/Release/AU/Dustbox.component" dist/Dustbox-AU-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent "build-macos/BeatFlip_artefacts/Release/Standalone/Dustbox.app" dist/Dustbox-Standalone-macOS.zip
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: Dustbox-macOS-development-build
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Beat-Flip-editor-preview
          path: |
            build-macos/Beat-Flip-Editor.png
            build-macos/Dustbox-*.png
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check web engine and pattern bank behavior
        working-directory: web
        run: node verify.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test live audio, performance pads, banks and responsive layout
        run: |
          mkdir -p build-web-preview
          DUSTBOX_SCREENSHOT_DIR="$PWD/build-web-preview" node web/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dustbox-web-performance-preview
          path: build-web-preview/*.png
          if-no-files-found: ignore
